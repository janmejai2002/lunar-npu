name: Visual Craft & Anti-Slop Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  agent-craft:
    name: Audit Visual Craft & WCAG Contrast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Self-Audit agent-craft
        run: node ./bin/agent-craft.js audit src/ --html craft-report.html

      - name: Upload Visual Craft Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-report
          path: craft-report.html
